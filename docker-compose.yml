services:
  postgres:
    image: postgres:16-alpine
    container_name: wdalarm-postgres
    networks:
      - wdalarm-network
    environment:
      POSTGRES_DB: wdalarm
      POSTGRES_USER: wdalarm
      POSTGRES_PASSWORD: wdalarm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wdalarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wdalarm-pgadmin
    networks:
      - wdalarm-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

networks:
  wdalarm-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
